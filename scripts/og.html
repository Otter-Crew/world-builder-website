<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/fraunces/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/public-sans/index.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f8f4eb; color: #3d3630;
    font-family: 'Public Sans Variable', system-ui, sans-serif;
    display: grid; grid-template-columns: 560px 1fr;
  }
  .copy { padding: 72px 0 72px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #8a7a68; }
  h1 { font-family: 'Fraunces Variable', Georgia, serif; font-weight: 320; font-size: 64px; line-height: 1.06; letter-spacing: -.022em; margin: 0; }
  .strap { font-size: 22px; color: #5a5048; }
  .shot { position: relative; overflow: hidden; }
  .shot img { position: absolute; left: 48px; top: 48px; width: 1400px; border-radius: 12px; box-shadow: 0 24px 60px rgba(60,40,20,.25); }
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">Otter Crew's World Builder</p>
    <h1>Write the book. Keep the whole world.</h1>
    <p class="strap">Your novel and its world in one folder of plain files. A Mac app you buy once.</p>
  </div>
  <div class="shot"><img src="../src/assets/screens/writing-workspace.png" alt=""></div>
</body>
</html>
